spring.application.name=autoloc-api
server.port=9091
# Connexion a la base de donnees (base renommee pour l'atelier 2 : associations)
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db2?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO
# Swagger UI : http://localhost:9091/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
